# Render blueprint — provisions the API + managed Postgres + persistent disk
# in one go. Apply with: `render blueprint apply` (or import via the UI).
#
# Layout assumed:
#   <repo-root>/
#     glimmora_lawyer/        Python backend (rootDir below)
#     frontend/               Next.js (deployed separately on Vercel)
#
# After first deploy:
#   1. Set ALLOWED_ORIGINS to your Vercel domain(s) — comma-separated.
#   2. Generate GLIMMORA_SECRET_KEY:
#        python -c "import secrets; print(secrets.token_urlsafe(48))"
#      and set it as an env var on the service.
#   3. Set USE_VERTEX_AI + GCP_PROJECT (base64 SA JSON) — see backend README.
#   4. Hit https://<service>.onrender.com/api/health to verify boot.
services:
  - type: web
    name: glimmora-lawyer-api
    runtime: python
    region: oregon              # change to your preferred region
    plan: starter               # bump to standard for multi-vCPU + more RAM
    rootDir: glimmora_lawyer
    autoDeploy: true
    branch: main

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2

    healthCheckPath: /api/health

    # Persistent disk for per-case files (raw PDFs, canonical JSON, chunks,
    # retrieval indexes, chat history, reports). The managed Postgres below
    # holds users / profiles / cases / audit logs.
    disk:
      name: glimmora-data
      mountPath: /var/data
      sizeGB: 5

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Glimmora Lawyer
      - key: LOG_LEVEL
        value: INFO

      # File roots — both live on the persistent disk so per-case work
      # survives restarts and redeploys.
      - key: DATA_ROOT
        value: /var/data
      - key: CASES_ROOT
        value: /var/data/cases

      # DB — Render wires the managed Postgres URL in automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: glimmora-lawyer-db
          property: connectionString

      # Session cookie. SET MANUALLY — do not let Render auto-generate a
      # value you can't reproduce locally. Use:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: GLIMMORA_SECRET_KEY
        sync: false             # must be filled in via dashboard
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      # Frontend origin allow-list — comma-separated, no trailing slash.
      # Example: https://glimmora.vercel.app,https://glimmora-preview.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

      # Demo accounts off in production.
      - key: SEED_DEMO_USERS
        value: "false"

      # ── Gemini / Vertex AI ───────────────────────────────────────────
      # Provide ONE of these paths:
      #   (a) Vertex via SA — USE_VERTEX_AI=true + GCP_PROJECT (base64 SA JSON)
      #   (b) AI Studio    — GEMINI_API_KEY
      # Otherwise the deterministic regex fallback is used.
      - key: USE_VERTEX_AI
        value: "false"          # flip to true after pasting GCP_PROJECT
      - key: GCP_PROJECT
        sync: false
      - key: GCP_LOCATION
        value: us-central1
      - key: GEMINI_API_KEY
        sync: false
      # Per-stage model overrides (optional). Defaults: flash for extraction,
      # pro for synthesis. See glimmora_lawyer/.env.example for the full list.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: ENTITY_EXTRACTION_CONCURRENCY
        value: "10"

databases:
  - name: glimmora-lawyer-db
    plan: free                  # 1 GB, no failover — bump for production
    databaseName: glimmora
    user: glimmora
